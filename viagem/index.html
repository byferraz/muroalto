<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a1650">
<title>Caixinha Muro Alto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: coluna mobile (máx 440px) — cartão de saldo pôr do sol, aportes do grupo, indicadores, gastos por categoria, extrato por dia */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef2f5; --fg:#0f1d2a; --muted:#6a7a89; --line:#e3e9ee;
  --sun-1:#3a1650; --sun-2:#b8336a; --sun-3:#ff8e5e; --pool:#2ec4b6; --sand:#ffd9a8; --accent:#c2416b;
  --c-comida:#ff8a3d; --c-transporte:#3b82f6; --c-hosp:#8b5cf6; --c-passeio:#10b5a6; --c-compras:#ec4899; --c-outros:#94a3b8;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#081521; --surface:#0f2131; --surface-2:#15293b; --fg:#e8f0f6; --muted:#8aa0b3; --line:#1d3245;
  --accent:#ff7aa2; color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:400;font-size:15px;line-height:1.45;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello small{display:block;font-size:.78rem;color:var(--muted)}
.hello strong{font-weight:600;font-size:1.05rem;letter-spacing:-.01em}
.crew{display:flex}
.crew{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 4px;border-radius:99px}
.crew .faces{display:flex}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:600;color:#fff;border:2px solid var(--bg);margin-left:-9px;flex:none}
.faces .av:first-child{margin-left:0}
.av-1{background:linear-gradient(135deg,var(--sun-3),var(--sun-2))}
.av-2{background:linear-gradient(135deg,#ff7d7a,#b8336a)}
.av-3{background:linear-gradient(135deg,var(--sun-2),#7a2163)}
.av-4{background:linear-gradient(135deg,#9a2a6a,var(--sun-1))}
.av-5{background:linear-gradient(135deg,#6b2a73,#2a1240)}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .25s}
.crew[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* aportes */
.contrib{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px 18px 16px;margin-top:-6px}
.contrib h3{font-size:.8rem;font-weight:500;color:var(--muted);margin:12px 0 4px}
.person{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 0}
.person + .person{border-top:1px solid var(--line)}
.person .av{margin:0;width:36px;height:36px;border:0;font-size:.8rem}
.person .n{font-weight:500}
.person .x{font-size:.72rem;color:var(--muted)}
.person .bar{grid-column:2/4;height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:-4px}
.person .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--sun-3),var(--sun-2))}
.person .v{font-weight:500}
.sum{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);padding-top:12px;border-top:1px dashed var(--line);margin-top:4px}
.sum + .sum{border:0;padding-top:4px;color:var(--fg);font-weight:600}

/* cartão */
.card{position:relative;overflow:hidden;border-radius:26px;padding:24px 22px 22px;color:#fff;
  background:radial-gradient(110% 80% at 100% 0%,rgba(255,217,168,.45) 0%,transparent 55%),
             radial-gradient(80% 70% at 0% 100%,rgba(46,196,182,.28) 0%,transparent 60%),
             linear-gradient(155deg,var(--sun-1) 0%,var(--sun-2) 58%,var(--sun-3) 100%);
  box-shadow:0 20px 40px -22px rgba(120,30,80,.75)}
.card::after{content:"";position:absolute;right:-60px;bottom:-70px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.14);
  box-shadow:0 0 0 28px rgba(255,255,255,.04),0 0 0 56px rgba(255,255,255,.03)}
.card-head{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:rgba(255,255,255,.78)}
.eye{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12)}
.eye svg{width:18px;height:18px}
.balance{font-size:2.6rem;font-weight:300;letter-spacing:-.03em;margin:10px 0 2px;line-height:1.05}
.balance .cur{font-size:1.1rem;font-weight:400;opacity:.8;margin-right:4px;vertical-align:.7em}
.of{font-size:.82rem;color:rgba(255,255,255,.75)}
.track{margin-top:20px;height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.track i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--pool),#b8f3ea);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.track-legend{display:flex;justify-content:space-between;margin-top:8px;font-size:.75rem;color:rgba(255,255,255,.78)}
.hide .money{filter:blur(9px);user-select:none}

/* indicadores */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat small{font-size:.7rem;color:var(--muted)}
.stat b{font-weight:600;font-size:1rem;overflow-wrap:anywhere}

/* secções */
.section{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.section h2{font-size:.95rem;font-weight:600;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
.section h2 span{font-size:.75rem;font-weight:400;color:var(--muted)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:14px 0 12px;gap:2px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.legend div{display:flex;align-items:center;gap:8px;font-size:.8rem;min-width:0}
.legend em{width:8px;height:8px;border-radius:50%;flex:none}
.legend span{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-weight:500}

/* extrato */
.day{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.day:first-of-type{margin-top:10px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0}
.tx + .tx{border-top:1px solid var(--line)}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px}
.tx .info{flex:1;min-width:0}
.tx .d{font-weight:500;overflow-wrap:anywhere}
.tx .m{font-size:.75rem;color:var(--muted)}
.tx .v{font-weight:500;white-space:nowrap}
.payer{display:inline-block;white-space:nowrap;font-size:.68rem;font-weight:500;padding:2px 8px;border-radius:99px;margin-top:3px;background:color-mix(in srgb,var(--sun-3) 18%,transparent);color:var(--accent)}
.payer.ok{background:var(--surface-2);color:var(--muted)}
.reemb{display:flex;align-items:center;gap:12px;padding:10px 0}
.reemb + .reemb{border-top:1px solid var(--line)}
.reemb .av{margin:0;width:34px;height:34px;border:0}
.reemb .n{flex:1;font-weight:500}
.reemb .n small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.tx-wrap + .tx,.tx + .tx-wrap,.tx-wrap + .tx-wrap{border-top:1px solid var(--line)}
.tx-wrap summary{list-style:none;cursor:pointer}
.tx-wrap summary::-webkit-details-marker{display:none}
.tx-wrap[open] .chev{transform:rotate(180deg)}
.items{margin:0 0 10px 54px;padding:4px 12px;border-radius:14px;background:var(--surface-2)}
.item > span{white-space:nowrap}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:.85rem}
.item + .item{border-top:1px solid var(--line)}
.empty{text-align:center;padding:26px 8px 10px;color:var(--muted);font-size:.88rem}
.empty .ic{margin:0 auto 12px;background:var(--surface-2);color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div class="hello"><small>Viagem a Muro Alto</small><strong>Caixinha do grupo</strong></div>
    <button class="crew" id="crew" aria-expanded="false" aria-controls="contrib" aria-label="Ver quanto cada um aportou">
      <span class="faces" id="faces"></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </header>

  <section class="contrib" id="contrib" hidden aria-label="Aportes do grupo">
    <h3>Quanto cada um aportou</h3>
    <div id="people"></div>
  </section>

  <section class="card" id="card" aria-label="Saldo">
    <div class="card-head"><span>Saldo disponível</span>
      <button class="eye" id="eye" aria-label="Ocultar valores" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="balance num money" id="saldo"><span class="cur">R$</span>—</div>
    <div class="of">de <span class="money num" id="inicial">—</span> no início da viagem</div>
    <div class="track" aria-hidden="true"><i id="fill"></i></div>
    <div class="track-legend"><span id="pctLeft">—</span><span>gasto <b class="money num" id="gasto">—</b></span></div>
  </section>

  <section class="stats">
    <div class="stat"><small>Gasto hoje</small><b class="num money" id="hoje">—</b></div>
    <div class="stat"><small id="ppLbl">Por dia</small><b class="num money" id="pp">—</b></div>
    <div class="stat"><small>Lançamentos</small><b class="num" id="qtd">—</b></div>
  </section>

  <section class="section" id="reembSec" hidden>
    <h2>A reembolsar <span id="reembTotal"></span></h2>
    <div id="reemb"></div>
  </section>

  <section class="section" id="catSec" hidden>
    <h2>Para onde foi o dinheiro <span id="catTotal"></span></h2>
    <div class="stack" id="stack"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="section">
    <h2>Extrato <span id="upd"></span></h2>
    <div id="list"><div class="empty">Carregando…</div></div>
  </section>

</main>

<script>
const IC={
 comida:'<path d="M5 3v8a3 3 0 0 0 6 0V3M8 3v18M17 3c-1.7 0-3 2.2-3 5s1.3 4 3 4v9"/>',
 transporte:'<path d="M5 17h14l-1.5-6.5A2 2 0 0 0 15.6 9H8.4a2 2 0 0 0-1.9 1.5zM3 17h18v2H3z"/><circle cx="7.5" cy="19.5" r="1.5"/><circle cx="16.5" cy="19.5" r="1.5"/>',
 hospedagem:'<path d="M3 20V8M3 14h18v6M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="2"/>',
 passeio:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 compras:'<path d="M6 7h12l-1 13H7zM9 7a3 3 0 0 1 6 0"/>',
 outros:'<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>'
};
const CAT={comida:["Comida","--c-comida"],transporte:["Transporte","--c-transporte"],hospedagem:["Hospedagem","--c-hosp"],
 passeio:["Passeios","--c-passeio"],compras:["Compras","--c-compras"],outros:["Outros","--c-outros"]};
const TZ="America/Bahia";
const VIAGEM_INI="2026-11-13", VIAGEM_FIM="2026-11-14"; // 2 dias de gastos (domingo saímos cedo)
const $=id=>document.getElementById(id);
const brl=v=>v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=c=>CAT[c]?c:"outros";
const icon=(c,size)=>`<span class="ic" style="background:color-mix(in srgb,var(${CAT[key(c)][1]}) 16%,transparent);color:var(${CAT[key(c)][1]})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[key(c)]}</svg></span>`;

try{if(localStorage.getItem("hide")==="1")toggle(true)}catch(e){}
$("eye").onclick=()=>toggle(!$("card").classList.contains("hide"));
function toggle(h){[$("card"),$("app")].forEach(el=>el.classList.toggle("hide",h));$("eye").setAttribute("aria-pressed",h);try{localStorage.setItem("hide",h?"1":"0")}catch(e){}}

$("crew").onclick=()=>{const o=$("crew").getAttribute("aria-expanded")!=="true";$("crew").setAttribute("aria-expanded",o);$("contrib").hidden=!o};
function people(list,d){
  $("faces").innerHTML=list.map((p,i)=>`<span class="av av-${i+1}">${esc(p.inicial)}</span>`).join("");
  const max=Math.max(...list.map(p=>p.aportou),1), tot=list.reduce((s,p)=>s+p.aportou,0);
  $("people").innerHTML=list.map((p,i)=>`<div class="person"><span class="av av-${i+1}">${esc(p.inicial)}</span>
    <div><div class="n">${esc(p.nome)}</div><div class="x">${esc(p.detalhe||"")}</div></div><div class="v num money">R$ ${brl(p.aportou)}</div>
    <div class="bar"><i style="width:${p.aportou/max*100}%"></i></div></div>`).join("")+
    `<div class="sum"><span>Total aportado pelo grupo</span><span class="num money">R$ ${brl(tot)}</span></div>`+
    (d.rendimento?`<div class="sum"><span>+ rendimento</span><span class="num money">R$ ${brl(Number(d.rendimento))}</span></div>`:"");
}
function render(d){
  if(d.integrantes&&d.integrantes.length)people(d.integrantes.slice().sort((a,b)=>b.aportou-a.aportou),d);
  const g=(d.gastos||[]).slice().sort((a,b)=>new Date(b.data)-new Date(a.data));
  const ini=Number(d.saldoInicial)||0, tot=g.reduce((s,x)=>s+Number(x.valor||0),0), saldo=ini-tot;
  $("saldo").innerHTML=`<span class="cur">R$</span>${brl(saldo)}`;
  $("inicial").textContent="R$ "+brl(ini);
  $("gasto").textContent="R$ "+brl(tot);
  const left=ini?Math.max(0,saldo/ini*100):0;
  $("fill").style.width=left+"%"; $("pctLeft").textContent=Math.round(left)+"% restante";
  const today=new Date().toDateString();
  $("hoje").textContent="R$ "+brl(g.filter(x=>new Date(x.data).toDateString()===today).reduce((s,x)=>s+Number(x.valor),0));
  // saldo disponível dividido pelos dias que faltam (contando hoje)
  const hojeISO=new Date().toLocaleDateString("en-CA",{timeZone:TZ});
  const dia=x=>Date.UTC(+x.slice(0,4),+x.slice(5,7)-1,+x.slice(8,10))/864e5;
  const dias=Math.max(1,Math.min(dia(VIAGEM_FIM)-dia(VIAGEM_INI)+1,dia(VIAGEM_FIM)-Math.max(dia(hojeISO),dia(VIAGEM_INI))+1));
  $("pp").textContent="R$ "+brl(saldo/dias);
  $("ppLbl").textContent="Por dia · "+dias+(dias===1?" dia":" dias");
  $("qtd").textContent=g.length;
  if(d.atualizado)$("upd").textContent="atualizado "+new Date(d.atualizado).toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",timeZone:TZ});

  // categorias
  const by={};g.forEach(x=>by[key(x.categoria)]=(by[key(x.categoria)]||0)+Number(x.valor));
  const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $("catSec").hidden=!cats.length;
  const pend={};g.flatMap(x=>x.itens?x.itens:[x]).filter(x=>x.pagoPor&&!x.reembolsado).forEach(x=>{(pend[x.pagoPor]=pend[x.pagoPor]||{v:0,n:0});pend[x.pagoPor].v+=Number(x.valor);pend[x.pagoPor].n++});
  const pl=Object.entries(pend).sort((a,b)=>b[1].v-a[1].v);
  $("reembSec").hidden=!pl.length;
  if(pl.length){
    const idx=n=>{const L=(d.integrantes||[]).slice().sort((a,b)=>b.aportou-a.aportou);const i=L.findIndex(p=>p.nome===n);return i<0?5:i+1};
    $("reembTotal").textContent="R$ "+brl(pl.reduce((s,[,o])=>s+o.v,0));
    $("reemb").innerHTML=pl.map(([n,o])=>`<div class="reemb"><span class="av av-${idx(n)}">${esc(n[0])}</span><div class="n">${esc(n)}<small>${o.n} ${o.n>1?"gastos pagos":"gasto pago"} do próprio bolso</small></div><b class="num money">R$ ${brl(o.v)}</b></div>`).join("");
  }
  if(cats.length){
    $("catTotal").textContent="R$ "+brl(tot);
    $("stack").innerHTML=cats.map(([c,v])=>`<i style="width:${v/tot*100}%;background:var(${CAT[c][1]})"></i>`).join("");
    $("legend").innerHTML=cats.map(([c,v])=>`<div><em style="background:var(${CAT[c][1]})"></em><span>${CAT[c][0]}</span><b class="num money">${Math.round(v/tot*100)}%</b></div>`).join("");
  }

  // extrato
  if(!g.length){$("list").innerHTML=`<div class="empty">${icon("passeio")}Nenhum gasto ainda.<br>Os lançamentos da viagem aparecem aqui.</div>`;return}
  let h="",last="",dayTot={};
  g.forEach(x=>{const k=new Date(x.data).toDateString();dayTot[k]=(dayTot[k]||0)+Number(x.valor)});
  g.forEach(x=>{
    const dt=new Date(x.data),k=dt.toDateString();
    if(k!==last){last=k;h+=`<div class="day"><span>${dt.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"short",timeZone:TZ})}</span><span class="num money">R$ ${brl(dayTot[k])}</span></div>`}
    const tag=y=>y.pagoPor?`<span class="payer${y.reembolsado?" ok":""}">Pago por ${esc(y.pagoPor)}${y.reembolsado?" · reembolsado":" · a reembolsar"}</span>`:"";
    const row=`${icon(x.categoria)}<div class="info"><div class="d">${esc(x.descricao)}</div><div class="m">${CAT[key(x.categoria)][0]} · ${dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:TZ})}${x.itens?` · ${x.itens.length} itens`:""}</div>${tag(x)}</div><div class="v num money">− R$ ${brl(Number(x.valor))}</div>`;
    h+=x.itens?`<details class="tx-wrap"><summary class="tx">${row}<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></summary><div class="items">${x.itens.map(i=>`<div class="item"><div><div>${esc(i.descricao)}</div>${tag(i)}</div><span class="num money">R$ ${brl(Number(i.valor))}</span></div>`).join("")}</div></details>`:`<div class="tx">${row}</div>`;
  });
  $("list").innerHTML=h;
}

async function load(){
  try{const r=await fetch("gastos.json?t="+Date.now(),{cache:"no-store"});render(await r.json())}
  catch(e){if(!$("list").querySelector(".tx"))$("list").innerHTML='<div class="empty">Não foi possível carregar os gastos. Verifique a conexão e recarregue.</div>'}
}
load(); setInterval(load,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
