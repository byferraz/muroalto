<title>Caixinha Salvador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one mobile column (max 440px) — saldo card, lançar gasto, extrato por dia */
:root{
  --bg:#eef0f4; --surface:#ffffff; --fg:#151a2c; --muted:#6b7186; --line:#e1e4ec;
  --card1:#1B2035; --card2:#2b3560; --sand:#ccbea7; --out:#c2413b; --ok:#2f7d5b;
  --display:'Rubik',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#181c2e; --fg:#eceef5; --muted:#9298ad; --line:#272c43;
  --card1:#242D4F; --card2:#33407a; --sand:#d8cbb3; --out:#ef7a72; --ok:#5fc495; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#181c2e; --fg:#eceef5; --muted:#9298ad; --line:#272c43;
  --card1:#242D4F; --card2:#33407a; --sand:#d8cbb3; --out:#ef7a72; --ok:#5fc495; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-family:var(--display);font-size:1.05rem;font-weight:600;margin:0}
.top span{font-size:.78rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{border-radius:22px;padding:22px;color:#fff;background:linear-gradient(140deg,var(--card1),var(--card2));
  display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 30px -14px rgba(20,25,50,.55)}
.card .lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sand)}
.card .big{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sand);width:0;transition:width .4s}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.8rem}
.row2 b{display:block;font-family:var(--display);font-size:1.05rem;font-weight:600;margin-top:2px}
.row2 div span{color:rgba(255,255,255,.7)}
.panel{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.panel h2{font-family:var(--display);font-size:1rem;margin:0;font-weight:600}
label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:4px}
input{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus-visible,button:focus-visible{outline:2px solid var(--card2);outline-offset:2px}
.amount{font-family:var(--display);font-size:1.4rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--card1);color:#fff;border-color:var(--card1)}
.primary{font:inherit;font-weight:600;border:0;border-radius:14px;padding:14px;background:var(--card1);color:#fff;cursor:pointer}
.primary:disabled{opacity:.5;cursor:default}
.msg{font-size:.8rem;color:var(--out);min-height:1em;margin:0}
.day{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--card2);flex:none}
.tx .info{flex:1;min-width:0}
.tx .d{font-weight:500;overflow-wrap:anywhere}
.tx .c{font-size:.75rem;color:var(--muted)}
.tx .v{font-family:var(--display);font-weight:600;color:var(--out);white-space:nowrap}
.tx .v.in{color:var(--ok)}
.del{font:inherit;font-size:.72rem;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px}
.del.sure{color:var(--out);font-weight:600}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:18px 6px;line-height:1.5}
.note{font-size:.75rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="app">
  <div class="top"><h1>Caixinha · Salvador</h1><span id="who">Conta do grupo</span></div>

  <section class="card" aria-label="Saldo">
    <div><div class="lbl">Saldo disponível</div><div class="big num" id="saldo">R$ —</div></div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <div class="row2">
      <div><span>Saldo inicial</span><b class="num" id="inicial">—</b></div>
      <div><span>Já gastamos</span><b class="num" id="gasto">—</b></div>
    </div>
  </section>

  <form class="panel" id="form" hidden>
    <h2>Lançar gasto</h2>
    <div><label for="desc">O que foi</label><input id="desc" maxlength="80" placeholder="Ex.: Almoço no Pelourinho" autocomplete="off"></div>
    <div><label for="valor">Quanto foi (R$)</label><input id="valor" class="amount num" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
    <div><label>Categoria</label><div class="chips" id="cats"></div></div>
    <p class="msg" id="msg"></p>
    <button class="primary" id="btn" type="submit">Lançar gasto</button>
  </form>

  <section class="panel" aria-label="Extrato">
    <h2>Extrato</h2>
    <div id="list"><div class="empty">Carregando o extrato…</div></div>
  </section>
  <p class="note">Só o tesoureiro lança gastos. Todos veem o saldo em tempo real.</p>
</div>

<script>
const CATS=[["Comida","CO"],["Transporte","TR"],["Hospedagem","HO"],["Passeio","PA"],["Compras","CP"],["Outros","OU"]];
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const $=id=>document.getElementById(id);
let inicial=null, gastos=[], canWrite=false, db=null, cat="Comida", pendingDel=null;

$("cats").innerHTML=CATS.map(([c])=>`<button type="button" class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
$("cats").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===cat));});

function render(){
  const total=gastos.reduce((s,g)=>s+(Number(g.valor)||0),0);
  $("gasto").textContent=brl(total);
  if(inicial!=null){
    $("inicial").textContent=brl(inicial);
    const s=inicial-total; $("saldo").textContent=brl(s);
    $("barFill").style.width=Math.max(0,Math.min(100,s/inicial*100))+"%";
  }
  const list=$("list");
  if(!gastos.length){list.innerHTML=`<div class="empty">Nenhum gasto lançado ainda.<br>Quando o tesoureiro lançar o primeiro, ele aparece aqui.</div>`;return}
  let html="",last="";
  for(const g of gastos){
    const d=new Date(g.ts);
    const day=d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"});
    if(day!==last){html+=`<p class="day">${day}</p>`;last=day}
    const ab=(CATS.find(c=>c[0]===g.cat)||CATS[5])[1];
    const hora=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    html+=`<div class="tx"><div class="ico">${ab}</div><div class="info"><div class="d"></div><div class="c">${g.cat||"Outros"} · ${hora}</div></div>
      <div style="text-align:right"><div class="v num">−${brl(Number(g.valor)||0)}</div>${canWrite?`<button class="del${pendingDel===g.id?" sure":""}" data-id="${g.id}">${pendingDel===g.id?"Confirmar exclusão":"Excluir"}</button>`:""}</div></div>`;
  }
  list.innerHTML=html;
  list.querySelectorAll(".tx .d").forEach((el,i)=>el.textContent=gastos[i].desc);
}

$("list").addEventListener("click",async e=>{
  const b=e.target.closest(".del");if(!b||!db)return;const id=b.dataset.id;
  if(pendingDel!==id){pendingDel=id;render();return}
  pendingDel=null;try{await db.collection("gastos").doc(id).delete()}catch(err){$("msg").textContent="Não foi possível excluir. Tente de novo."}
});

$("form").addEventListener("submit",async e=>{
  e.preventDefault();$("msg").textContent="";
  const desc=$("desc").value.trim();
  const valor=Number($("valor").value.replace(/\./g,"").replace(",","."));
  if(!desc){$("msg").textContent="Escreva o que foi o gasto.";return}
  if(!(valor>0)){$("msg").textContent="Informe um valor maior que zero, ex.: 45,90.";return}
  $("btn").disabled=true;
  try{await db.collection("gastos").add({desc,valor:Math.round(valor*100)/100,cat,ts:Date.now()});
    $("desc").value="";$("valor").value="";$("desc").focus();}
  catch(err){$("msg").textContent="Não foi possível lançar. Verifique a conexão e tente de novo."}
  $("btn").disabled=false;
});

(async()=>{
  const timer=setTimeout(()=>{if(inicial==null)$("list").innerHTML=`<div class="empty">Não foi possível carregar o extrato. Abra a página com sua conta para ver o saldo.</div>`},10000);
  db=await claude.use("db");
  if(!db){clearTimeout(timer);$("list").innerHTML=`<div class="empty">Entre com sua conta para ver o saldo e o extrato.</div>`;return}
  const user=await claude.use("user");
  try{canWrite=user?await user.canEdit():false}catch{canWrite=false}
  $("form").hidden=!canWrite;
  $("who").textContent=canWrite?"Você é o tesoureiro":"Somente leitura";
  db.doc("config/caixa").onSnapshot(s=>{clearTimeout(timer);const d=s.data();inicial=d?Number(d.inicial):null;render()},()=>{});
  db.collection("gastos").orderBy("ts","desc").onSnapshot(s=>{clearTimeout(timer);gastos=s.docs.map(d=>({id:d.id,...d.data()}));render()},
    ()=>{$("list").innerHTML=`<div class="empty">Não foi possível carregar o extrato. Recarregue a página.</div>`});
})();
</script>
